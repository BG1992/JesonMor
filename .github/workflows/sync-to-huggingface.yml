name: Sync to Hugging Face Space
# Pushes the repository to the Space named by the repository variable HF_SPACE (e.g. "user/jeson-mor") with the
# secret HF_TOKEN (a Hugging Face token with write access). Hugging Face accepts binary files only through Git LFS,
# so the binary tables are converted to LFS in this runner only; the GitHub repository stays without LFS.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git lfs install
          git lfs migrate import --everything --include="*.bin,*.npz"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
